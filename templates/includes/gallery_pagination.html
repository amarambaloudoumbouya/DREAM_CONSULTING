{% if page_obj.paginator.num_pages > 1 %}
<nav class="{{ css_class }}" aria-label="{{ label }}">
    {% if page_obj.has_previous %}
    <a href="?{% if query_extra %}{{ query_extra }}&{% endif %}page={{ page_obj.previous_page_number }}" title="Précédent">
        <i class="las la-angle-left"></i>
    </a>
    {% else %}
    <span class="disabled"><i class="las la-angle-left"></i></span>
    {% endif %}

    {% for num in page_numbers %}
        {% if page_obj.number == num %}
        <span class="current">{{ num }}</span>
        {% else %}
        <a href="?{% if query_extra %}{{ query_extra }}&{% endif %}page={{ num }}">{{ num }}</a>
        {% endif %}
    {% endfor %}

    {% if page_obj.has_next %}
    <a href="?{% if query_extra %}{{ query_extra }}&{% endif %}page={{ page_obj.next_page_number }}" title="Suivant">
        <i class="las la-angle-right"></i>
    </a>
    {% else %}
    <span class="disabled"><i class="las la-angle-right"></i></span>
    {% endif %}
</nav>
{% endif %}
